<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <title>لوحة مراجعة الآدمن - Futa Arab</title>
</head>
<body class="bg-[#0b0c10] text-white min-h-screen p-4 pb-20">
    <div class="max-w-md mx-auto space-y-8 mt-10">
        <!-- قسم المراجعة للآدمن -->
        <div class="bg-[#12141d] p-6 rounded-3xl border border-gray-800 shadow-2xl">
            <h1 class="text-2xl font-black mb-6 flex items-center gap-3 text-red-500">
                <i class="fas fa-shield-alt"></i>
                لوحة الإدارة والمراجعة
            </h1>
            <h2 class="text-xl font-bold mb-4 text-orange-400">طلبات رفع جديدة</h2>
            
            <div id="pendingList" class="flex flex-col gap-4">
                <div class="text-center text-gray-500 py-4 text-sm">جاري تحميل الطلبات...</div>
            </div>
        </div>
    </div>

    <script>
        let sbClient = null;
        window.addEventListener('load', () => {
            if (typeof supabase !== 'undefined') {
                const supabaseUrl = 'https://vosnoijtrovgtvpxnzsr.supabase.co';
                const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvc25vaWp0cm92Z3R2cHhuenNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMDI0MjUsImV4cCI6MjEwNzU3ODQyNX0.k9B4P5vOMqNKFzpALb2aZrajjeyeKFaJW5qJz0iTqS0';
                sbClient = supabase.createClient(supabaseUrl, supabaseKey);
                loadPendingMangas();
            }
        });

        async function loadPendingMangas() {
            const listDiv = document.getElementById('pendingList');
            try {
                const { data, error } = await sbClient.from('mangas').select('*').eq('status', 'pending');
                if (error) throw error;

                if (data.length === 0) {
                    listDiv.innerHTML = '<div class="text-center text-gray-500 py-6 bg-[#1a1c23] rounded-xl">لا توجد طلبات معلقة حالياً</div>';
                    return;
                }

                listDiv.innerHTML = '';
                data.forEach(manga => {
                    listDiv.innerHTML += `
                        <div class="bg-[#1a1c23] p-3 rounded-xl border border-gray-700 flex items-center gap-4">
                            <img src="${manga.cover_image_url}" class="w-16 h-20 object-cover rounded-lg">
                            <div class="flex-1">
                                <h3 class="font-bold text-sm text-white mb-2">${manga.title}</h3>
                                <div class="flex gap-2">
                                    <button onclick="approveManga(${manga.id})" class="flex-1 bg-green-600/20 text-green-400 hover:bg-green-600 py-1.5 rounded-lg text-xs font-bold">✅ قبول</button>
                                    <button onclick="rejectManga(${manga.id})" class="flex-1 bg-red-600/20 text-red-400 hover:bg-red-600 py-1.5 rounded-lg text-xs font-bold">❌ رفض</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) { alert("خطأ: " + error.message); }
        }

        async function approveManga(id) {
            if(!confirm('هل أنت متأكد من قبول هذا العمل؟')) return;
            await sbClient.from('mangas').update({ status: 'approved' }).eq('id', id);
            loadPendingMangas();
        }

        async function rejectManga(id) {
            if(!confirm('هل أنت متأكد من رفض هذا العمل؟')) return;
            await sbClient.from('mangas').delete().eq('id', id);
            loadPendingMangas();
        }
    </script>
</body>
</html>
