<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <title>لوحة الإدارة - Futa Arab</title>
    <style>
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-100%); opacity: 0; } }
        .toast-enter { animation: slideDown 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
        .toast-exit { animation: slideUp 0.5s ease-in forwards; }
        input[type="file"]::file-selector-button { margin-inline-end: 1rem; padding: 0.5rem 1rem; border-radius: 9999px; border: none; background-color: #9333ea; color: white; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
        input[type="file"]::file-selector-button:hover { background-color: #7e22ce; }
    </style>
</head>
<body class="bg-[#0b0c10] text-white min-h-screen flex items-center justify-center p-4 font-sans relative overflow-hidden">

    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 hidden w-[90%] max-w-sm">
        <div id="toastBg" class="bg-gray-800 border border-gray-700 rounded-xl shadow-2xl p-4 flex items-center gap-4">
            <div id="toastIcon" class="text-2xl"></div>
            <div class="flex-1">
                <h4 id="toastTitle" class="font-bold text-sm"></h4>
                <p id="toastMessage" class="text-xs text-gray-400 mt-1"></p>
            </div>
            <button onclick="hideToast()" class="text-gray-500 hover:text-white transition-colors"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <!-- نافذة الأخطاء الصامتة (مهمة جداً للمطورين) -->
    <div id="debugLog" class="hidden fixed bottom-0 left-0 w-full bg-red-900 text-white text-xs p-2 z-50 font-mono"></div>

    <div class="bg-[#12141d] p-8 rounded-3xl border border-gray-800 max-w-md w-full shadow-[0_10px_40px_rgba(0,0,0,0.5)] relative">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <h1 class="text-2xl font-black mb-8 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center shadow-lg">
                <i class="fas fa-cloud-upload-alt text-white"></i>
            </div>
            إضافة مانغا جديدة
        </h1>
        
        <div class="flex flex-col gap-5 relative z-10">
            <div>
                <label class="text-sm text-gray-400 mb-2 block font-medium">عنوان المانغا</label>
                <div class="relative">
                    <i class="fas fa-book absolute right-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input id="mangaTitle" type="text" placeholder="اكتب العنوان هنا..." class="w-full bg-[#1a1c23] py-3 pr-12 pl-4 rounded-xl border border-gray-700 outline-none focus:border-purple-500 text-white">
                </div>
            </div>
            <div>
                <label class="text-sm text-gray-400 mb-2 block font-medium">الغلاف الرسمي</label>
                <div class="relative border-2 border-dashed border-gray-700 rounded-xl p-2 bg-[#1a1c23] group">
                    <input id="mangaCoverFile" type="file" accept="image/*" class="w-full text-gray-400 text-sm cursor-pointer outline-none">
                </div>
            </div>

            <button type="button" onclick="uploadMangaWithImage()" id="uploadBtn" class="mt-4 bg-gradient-to-r from-purple-600 to-indigo-600 active:scale-95 transition-all text-white font-bold py-4 px-4 rounded-xl shadow-[0_0_20px_rgba(147,51,234,0.3)] flex items-center justify-center gap-2">
                <span id="btnText">رفع واعتماد العمل</span>
                <i id="btnIcon" class="fas fa-arrow-left"></i>
            </button>
        </div>
    </div>

    <script>
        function logError(msg) {
            const debugLog = document.getElementById('debugLog');
            debugLog.classList.remove('hidden');
            debugLog.innerText += msg + "\n";
            console.error(msg);
        }

        window.onerror = function(message, source, lineno, colno, error) {
            logError("خطأ عام: " + message);
            return true;
        };

        const supabaseUrl = 'https://vosnoijtrovgtvpxnzsr.supabase.co';
        const supabaseKey = 'Sb_publishable_4FaQksGSyIDY-pFHL7Y07g_VNBu4rm4';
        
        let supabase;
        try {
            if (window.supabase) {
                supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
            } else {
                logError("مكتبة Supabase لم يتم تحميلها. تأكد من اتصالك بالإنترنت.");
            }
        } catch (e) {
            logError("خطأ في تهيئة Supabase: " + e.message);
        }

        let toastTimeout;
        function showToast(type, title, message) {
            const toast = document.getElementById('toast');
            const toastBg = document.getElementById('toastBg');
            const toastIcon = document.getElementById('toastIcon');
            const toastTitle = document.getElementById('toastTitle');
            const toastMessage = document.getElementById('toastMessage');

            if (type === 'loading') {
                toastBg.className = 'bg-[#1a1c23] border border-blue-900/50 rounded-xl shadow-2xl p-4 flex items-center gap-4';
                toastIcon.innerHTML = '<i class="fas fa-circle-notch fa-spin text-blue-400"></i>';
                toastTitle.className = 'font-bold text-sm text-blue-400';
            } else if (type === 'success') {
                toastBg.className = 'bg-[#1a1c23] border border-green-900/50 rounded-xl shadow-2xl p-4 flex items-center gap-4';
                toastIcon.innerHTML = '<i class="fas fa-check-circle text-green-400"></i>';
                toastTitle.className = 'font-bold text-sm text-green-400';
            } else if (type === 'error') {
                toastBg.className = 'bg-[#1a1c23] border border-red-900/50 rounded-xl shadow-2xl p-4 flex items-center gap-4';
                toastIcon.innerHTML = '<i class="fas fa-exclamation-circle text-red-400"></i>';
                toastTitle.className = 'font-bold text-sm text-red-400';
            }

            toastTitle.innerText = title;
            toastMessage.innerText = message;
            
            toast.classList.remove('hidden', 'toast-exit');
            toast.classList.add('toast-enter');

            clearTimeout(toastTimeout);
            if (type !== 'loading') toastTimeout = setTimeout(hideToast, 4000);
        }

        function hideToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('toast-enter');
            toast.classList.add('toast-exit');
            setTimeout(() => toast.classList.add('hidden'), 500);
        }

        async function uploadMangaWithImage() {
            try {
                if (!supabase) {
                    showToast('error', 'مشكلة في الاتصال', 'قاعدة البيانات غير متصلة.');
                    return;
                }

                const titleInput = document.getElementById('mangaTitle').value;
                const fileInput = document.getElementById('mangaCoverFile').files[0];
                const btn = document.getElementById('uploadBtn');
                const btnText = document.getElementById('btnText');
                const btnIcon = document.getElementById('btnIcon');

                if(!titleInput || !fileInput) {
                    showToast('error', 'بيانات ناقصة', 'يرجى كتابة عنوان المانغا واختيار صورة الغلاف.');
                    return;
                }

                btn.disabled = true;
                btnText.innerText = 'جاري الرفع...';
                btnIcon.className = 'fas fa-spinner fa-spin';
                showToast('loading', 'جاري معالجة العمل', 'يتم الآن رفع الصورة...');

                const fileExt = fileInput.name.split('.').pop() || 'jpg';
                const fileName = `${Math.random()}.${fileExt}`;
                
                const { error: uploadError } = await supabase.storage
                    .from('manga-covers')
                    .upload(fileName, fileInput);

                if (uploadError) throw new Error("فشل رفع الصورة: " + uploadError.message);

                const { data: publicUrlData } = supabase.storage
                    .from('manga-covers')
                    .getPublicUrl(fileName);
                
                const { error: dbError } = await supabase
                    .from('mangas')
                    .insert([{ title: titleInput, cover_image_url: publicUrlData.publicUrl, status: 'pending' }]);

                if (dbError) throw new Error("فشل حفظ البيانات: " + dbError.message);

                showToast('success', 'اكتملت العملية!', 'تم حفظ المانغا بنجاح.');
                document.getElementById('mangaTitle').value = '';
                document.getElementById('mangaCoverFile').value = '';

                btn.disabled = false;
                btnText.innerText = 'رفع واعتماد العمل';
                btnIcon.className = 'fas fa-arrow-left';

            } catch (error) {
                logError(error.message);
                showToast('error', 'حدث خطأ', error.message);
                
                document.getElementById('uploadBtn').disabled = false;
                document.getElementById('btnText').innerText = 'حاول مرة أخرى';
                document.getElementById('btnIcon').className = 'fas fa-redo';
            }
        }
    </script>
</body>
</html>
