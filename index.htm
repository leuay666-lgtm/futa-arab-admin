<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <title>لوحة الإدارة - Futa Arab</title>
    <style>
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-100%); opacity: 0; } }
        .toast-enter { animation: slideDown 0.5s forwards; }
        .toast-exit { animation: slideUp 0.5s forwards; }
        input[type="file"]::file-selector-button { margin-inline-end: 1rem; padding: 0.5rem 1rem; border-radius: 99px; border: none; background-color: #9333ea; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body class="bg-[#0b0c10] text-white min-h-screen flex items-center justify-center p-4">

    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 hidden w-[90%] max-w-sm">
        <div id="toastBg" class="bg-gray-800 border border-gray-700 rounded-xl shadow-2xl p-4 flex items-center gap-4">
            <div id="toastIcon" class="text-2xl"></div>
            <div class="flex-1">
                <h4 id="toastTitle" class="font-bold text-sm"></h4>
                <p id="toastMessage" class="text-xs text-gray-400 mt-1"></p>
            </div>
            <button onclick="hideToast()" class="text-gray-500"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <div class="bg-[#12141d] p-8 rounded-3xl border border-gray-800 max-w-md w-full shadow-2xl">
        <h1 class="text-2xl font-black mb-8 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center">
                <i class="fas fa-cloud-upload-alt"></i>
            </div>
            إضافة مانغا جديدة
        </h1>
        
        <div class="flex flex-col gap-5">
            <div>
                <label class="text-sm text-gray-400 mb-2 block font-medium">عنوان المانغا</label>
                <input id="mangaTitle" type="text" placeholder="اكتب العنوان هنا..." class="w-full bg-[#1a1c23] py-3 px-4 rounded-xl border border-gray-700 outline-none text-white">
            </div>
            <div>
                <label class="text-sm text-gray-400 mb-2 block font-medium">الغلاف الرسمي</label>
                <input id="mangaCoverFile" type="file" accept="image/*" class="w-full bg-[#1a1c23] p-2 rounded-xl border-2 border-dashed border-gray-700 text-gray-400">
            </div>

            <button type="button" onclick="uploadMangaWithImage()" id="uploadBtn" class="mt-4 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-4 px-4 rounded-xl flex items-center justify-center gap-2">
                <span id="btnText">رفع واعتماد العمل</span>
                <i id="btnIcon" class="fas fa-arrow-left"></i>
            </button>
        </div>
    </div>

    <script>
        let sbClient = null;

        window.addEventListener('load', () => {
            if (typeof supabase !== 'undefined') {
                const supabaseUrl = 'https://vosnoijtrovgtvpxnzsr.supabase.co';
                // المفتاح الصحيح مع تعديل الحرف الأول إلى e صغير
                const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvc25vaWp0cm92Z3R2cHhuenNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMDI0MjUsImV4cCI6MjEwNzU3ODQyNX0.k9B4P5vOMqNKFzpALb2aZrajjeyeKFaJW5qJz0iTqS0';
                sbClient = supabase.createClient(supabaseUrl, supabaseKey);
            } else {
                alert("⚠️ تحذير: المتصفح يمنع الاتصال بقاعدة البيانات.");
            }
        });

        let toastTimeout;
        function showToast(type, title, message) {
            const toast = document.getElementById('toast');
            const toastBg = document.getElementById('toastBg');
            const toastIcon = document.getElementById('toastIcon');
            const toastTitle = document.getElementById('toastTitle');
            const toastMessage = document.getElementById('toastMessage');

            if (type === 'loading') {
                toastBg.className = 'bg-[#1a1c23] border border-blue-900 rounded-xl p-4 flex items-center gap-4';
                toastIcon.innerHTML = '<i class="fas fa-circle-notch fa-spin text-blue-400"></i>';
                toastTitle.className = 'font-bold text-sm text-blue-400';
            } else if (type === 'success') {
                toastBg.className = 'bg-[#1a1c23] border border-green-900 rounded-xl p-4 flex items-center gap-4';
                toastIcon.innerHTML = '<i class="fas fa-check-circle text-green-400"></i>';
                toastTitle.className = 'font-bold text-sm text-green-400';
            }

            toastTitle.innerText = title;
            toastMessage.innerText = message;
            toast.classList.remove('hidden', 'toast-exit');
            toast.classList.add('toast-enter');

            clearTimeout(toastTimeout);
            if (type !== 'loading') toastTimeout = setTimeout(hideToast, 4000);
        }

        function hideToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('toast-enter');
            toast.classList.add('toast-exit');
            setTimeout(() => toast.classList.add('hidden'), 500);
        }

        async function uploadMangaWithImage() {
            try {
                if (!sbClient) {
                    alert('❌ لا يوجد اتصال بقاعدة البيانات.');
                    return;
                }

                const titleInput = document.getElementById('mangaTitle').value;
                const fileInput = document.getElementById('mangaCoverFile').files[0];
                const btn = document.getElementById('uploadBtn');

                if(!titleInput || !fileInput) {
                    alert('⚠️ يرجى كتابة عنوان المانغا واختيار صورة الغلاف أولاً.');
                    return;
                }

                btn.disabled = true;
                showToast('loading', 'جاري معالجة العمل', 'يتم الآن رفع الصورة وحفظ البيانات...');

                const fileExt = fileInput.name.split('.').pop() || 'jpg';
                const fileName = `${Math.random()}.${fileExt}`;
                
                const { error: uploadError } = await sbClient.storage.from('manga-covers').upload(fileName, fileInput);
                if (uploadError) throw new Error("مشكلة في رفع الصورة: " + uploadError.message);

                const { data: publicUrlData } = sbClient.storage.from('manga-covers').getPublicUrl(fileName);
                
                const { error: dbError } = await sbClient.from('mangas').insert([{ 
                    title: titleInput, 
                    cover_image_url: publicUrlData.publicUrl, 
                    status: 'pending' 
                }]);
                
                if (dbError) throw new Error("مشكلة في قاعدة البيانات: " + dbError.message);

                showToast('success', 'نجاح!', 'تم رفع الغلاف والمانغا بنجاح.');
                document.getElementById('mangaTitle').value = '';
                document.getElementById('mangaCoverFile').value = '';
                btn.disabled = false;

            } catch (error) {
                alert("❌ حدث خطأ: " + error.message);
                document.getElementById('uploadBtn').disabled = false;
                hideToast();
            }
        }
    </script>
</body>
</html>
